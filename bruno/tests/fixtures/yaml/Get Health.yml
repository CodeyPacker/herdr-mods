info:
  name: Get Health
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/health"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        test("says ok", function () {
          expect(res.getBody().ok).to.equal(true);
        });

settings:
  encodeUrl: true
